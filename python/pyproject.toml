[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trainpool-torch"
version = "0.1.0"
description = "PyTorch SDK for TrainPool distributed logical training memory"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["blake3>=0.4", "numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.2"]
test = ["pytest>=8", "ruff>=0.8", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["trainpool_torch*"]
